<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实验一 · 机械臂仿真（一）· 虚拟示教器</title>
<style>
  :root {
    --bg: #0f141b; --panel: #151c26; --line: #26303d;
    --txt: #d7e2ef; --dim: #8697ab; --accent: #4da3ff; --warn: #ffb020; --bad: #ff5f56; --ok: #52d17c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
               font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; overflow: hidden; }
  #app { display: flex; height: 100%; }
  #viewport { position: relative; flex: 1 1 auto; min-width: 0; }
  #viewport canvas { display: block; }

  #hud { position: absolute; left: 12px; top: 12px; pointer-events: none;
         font: 12px/1.6 Consolas, "Cascadia Mono", monospace; color: var(--dim); }
  #status { color: var(--ok); white-space: pre; }
  #status.bad { color: var(--bad); }
  #status.warn { color: var(--warn); }

  aside#pendant { width: 272px; flex: 0 0 272px; background: var(--panel);
                  border-left: 1px solid var(--line); padding: 14px; overflow-y: auto; }
  aside h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: .04em; }
  aside .sub { color: var(--dim); font-size: 11px; margin-bottom: 12px; }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin-bottom: 10px; }
  .card h2 { font-size: 11px; color: var(--dim); font-weight: 600; letter-spacing: .08em;
             margin: 0 0 8px; text-transform: uppercase; }
  .row { display: flex; justify-content: space-between; gap: 8px; font: 12px/1.7 Consolas, monospace;
         white-space: nowrap; }
  .row span:first-child { color: var(--dim); }
  .row span:last-child { color: var(--txt); }
  #quat { font-size: 11px; letter-spacing: -.2px; }
  button { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--line);
           background: #1b2431; color: var(--txt); cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button#estop { border-color: #5a2b28; background: #2a1a19; color: #ff8d86; }
  button#estop.on { background: #7d2620; color: #fff; border-color: #ff5f56; }
  .muted { color: var(--dim); font-size: 11px; }
  kbd { background: #1b2431; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="hud"><pre id="status">正在初始化…</pre></div>
  </div>

  <aside id="pendant">
    <h1>虚拟示教器</h1>
    <div class="sub">实验一 · 机械臂仿真（一）</div>

    <div class="card">
      <h2>示教器 · 控制</h2>
      <div id="gui-slot"></div>
    </div>

    <div class="card">
      <h2>末端执行器 · TCP（基座系，米）</h2>
      <div class="row"><span>X</span><span id="pos-x">—</span></div>
      <div class="row"><span>Y</span><span id="pos-y">—</span></div>
      <div class="row"><span>Z</span><span id="pos-z">—</span></div>
      <div class="row" style="margin-top:6px"><span>R</span><span id="rpy-r">—</span></div>
      <div class="row"><span>P</span><span id="rpy-p">—</span></div>
      <div class="row"><span>Y</span><span id="rpy-y">—</span></div>
      <div class="row" style="margin-top:6px"><span>四元数</span><span id="quat">—</span></div>
    </div>

    <div class="card">
      <h2>安全</h2>
      <button id="estop">急停 E-STOP</button>
      <div class="muted" style="margin-top:8px">
        急停优先级最高：生效后点动与程序都被拒绝。
      </div>
    </div>

    <div class="card">
      <h2>用法</h2>
      <div class="muted">
        右键拖拽 = 平移 · 左键拖拽 = 旋转 · 滚轮 = 缩放<br>
        调试：地址栏加 <kbd>?debug=1</kbd> 显示关节轴
      </div>
    </div>
  </aside>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
